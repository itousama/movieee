<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie Library</title>
    <style>
        :root { 
            --bg-color: #0a0a0a; 
            --bg-surface: #121212;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --accent-color: #1db954; 
            --accent-hover: #1ed760;
            --card-hover-shadow: 0 12px 24px rgba(0,0,0,0.6);
            --grid-columns: repeat(auto-fill, minmax(160px, 1fr));
        }

        body { 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased;
        }
        
        header { 
            padding: 15px 25px; 
            background-color: rgba(10, 10, 10, 0.7); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 100; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; 
        }
        .logo-nav { display: flex; align-items: center; gap: 25px; }
        h1 { margin: 0; font-size: 22px; font-weight: 800; cursor: pointer; color: var(--text-main); letter-spacing: -0.5px; }
        .nav-btn { background: none; border: none; color: var(--text-sub); font-size: 15px; font-weight: 600; cursor: pointer; transition: color 0.2s; padding: 0; }
        .nav-btn:hover, .nav-btn.active { color: var(--text-main); }

        .header-controls { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .toggle-switch { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text-sub); cursor: pointer; }
        
        .header-select { background-color: rgba(255,255,255,0.1); color: white; border: none; padding: 8px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; outline: none; cursor: pointer; transition: background 0.2s; }
        .header-select:hover { background-color: rgba(255,255,255,0.2); }
        
        .add-btn { background-color: var(--text-main); color: var(--bg-color); border: none; border-radius: 24px; padding: 8px 20px; cursor: pointer; font-size: 14px; font-weight: 700; transition: transform 0.2s, background-color 0.2s; }
        .add-btn:hover { background-color: #e0e0e0; transform: scale(1.04); }
        
        .controls-bar { 
            padding: 15px 25px; 
            background: linear-gradient(to bottom, rgba(18,18,18,1) 0%, rgba(10,10,10,1) 100%);
            display: flex; gap: 12px; flex-wrap: wrap; align-items: center; 
        }
        .controls-bar select, .controls-bar input { 
            background-color: rgba(255,255,255,0.08); color: white; border: 1px solid transparent; 
            padding: 10px 16px; border-radius: 30px; font-size: 13px; outline: none; transition: 0.2s;
        }
        .controls-bar select:focus, .controls-bar input:focus { border-color: rgba(255,255,255,0.3); background-color: rgba(255,255,255,0.12); }
        
        /* ★ 修正ポイント：プルダウンの選択肢（option）の背景色と文字色を固定 */
        select option {
            background-color: #1a1a1a;
            color: #ffffff;
        }

        .grid-view { padding: 25px; display: grid; grid-template-columns: var(--grid-columns); gap: 25px 20px; }
        .movie-card { cursor: pointer; display: flex; flex-direction: column; text-align: left; }
        
        .poster-wrapper {
            position: relative; width: 100%; aspect-ratio: 2 / 3; border-radius: 12px; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s;
            margin-bottom: 12px; background-color: #222;
        }
        .movie-card:hover .poster-wrapper { transform: translateY(-8px); box-shadow: var(--card-hover-shadow); }
        .movie-poster { width: 100%; height: 100%; object-fit: cover; }
        
        .movie-title { font-size: 15px; font-weight: 700; margin: 0 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.3px; }
        .movie-subtitle { font-size: 13px; font-weight: 500; color: var(--text-sub); margin: 0; }
        
        .playlist-cover { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; width: 100%; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background-color: #222; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: transform 0.3s, box-shadow 0.3s; margin-bottom: 12px; }
        .movie-card:hover .playlist-cover { transform: translateY(-8px); box-shadow: var(--card-hover-shadow); }
        .playlist-cover img { width: 100%; height: 100%; object-fit: cover; }
        
        #detail-view { display: none; position: relative; padding-bottom: 80px; min-height: 100vh; }
        
        .backdrop-container { position: absolute; top: 0; left: 0; width: 100%; height: 60vh; z-index: -1; overflow: hidden; }
        .backdrop-img { width: 100%; height: 100%; background-size: cover; background-position: top center; opacity: 0.4; filter: blur(4px); transform: scale(1.05); }
        .backdrop-gradient { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(10,10,10,0) 0%, rgba(10,10,10,0.8) 60%, rgba(10,10,10,1) 100%); }
        
        .detail-inner { max-width: 1000px; margin: 0 auto; padding: 40px 30px; position: relative; z-index: 10; }
        
        .tagline { font-size: 26px; font-style: italic; font-weight: 700; text-align: center; margin: 0 0 50px 0; color: rgba(255,255,255,0.9); text-shadow: 0 2px 20px rgba(0,0,0,0.8); line-height: 1.4; letter-spacing: 1px; }
        
        .detail-header { display: flex; gap: 40px; align-items: flex-end; padding-bottom: 30px; }
        @media (max-width: 768px) { .detail-header { flex-direction: column; align-items: center; text-align: center; } }
        
        .detail-poster-container { flex: 0 0 260px; display: flex; flex-direction: column; gap: 12px; }
        .detail-poster { width: 100%; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .poster-change-btn { background-color: rgba(255,255,255,0.1); border: none; color: var(--text-sub); border-radius: 20px; padding: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; backdrop-filter: blur(10px); }
        .poster-change-btn:hover { background-color: rgba(255,255,255,0.2); color: white; }
        
        .detail-info { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
        .detail-type { font-size: 12px; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; color: var(--text-sub); letter-spacing: 1px; }
        .detail-title { font-size: 56px; font-weight: 900; margin: 0 0 20px 0; line-height: 1.1; letter-spacing: -1px; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        @media (max-width: 768px) { .detail-title { font-size: 38px; } }
        
        .detail-meta { font-size: 14px; font-weight: 500; color: #ccc; line-height: 1.8; }
        .person-link { font-weight: 700; color: #fff; cursor: pointer; transition: color 0.2s; }
        .person-link:hover { text-decoration: underline; color: var(--accent-hover); }
        .meta-dot::before { content: " • "; margin: 0 8px; opacity: 0.4; }
        
        .overview-text { font-size: 15px; color: rgba(255,255,255,0.8); line-height: 1.7; margin-top: 25px; font-weight: 400; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
        .overview-text:hover { -webkit-line-clamp: unset; } 
        
        .action-bar { display: flex; gap: 15px; margin-top: 30px; flex-wrap: wrap; }
        .spotify-btn { background-color: var(--accent-color); color: black; border: none; border-radius: 30px; padding: 12px 28px; font-size: 15px; font-weight: 800; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; transition: transform 0.2s, background-color 0.2s; }
        .spotify-btn:hover { transform: scale(1.04); background-color: var(--accent-hover); }
        .pl-add-btn { background-color: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 30px; padding: 12px 24px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .pl-add-btn:hover { background-color: rgba(255,255,255,0.2); border-color: white; }
        
        .section-title { font-size: 22px; font-weight: 800; margin: 50px 0 20px 0; letter-spacing: -0.5px; }
        .horizontal-scroll { display: flex; overflow-x: auto; gap: 20px; padding-bottom: 20px; scroll-snap-type: x mandatory; }
        .horizontal-scroll .movie-card { min-width: 150px; flex: 0 0 150px; scroll-snap-align: start; }
        .horizontal-scroll::-webkit-scrollbar { height: 6px; }
        .horizontal-scroll::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.2); border-radius: 10px; }
        
        .editor-section { background-color: rgba(255,255,255,0.03); border-radius: 16px; padding: 30px; margin-top: 40px; border: 1px solid rgba(255,255,255,0.05); }
        .rating-buttons { display: flex; gap: 15px; margin-bottom: 25px; }
        .rate-btn { background-color: transparent; color: white; border: 1px solid rgba(255,255,255,0.4); border-radius: 30px; padding: 10px 24px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .rate-btn.active-good { background-color: var(--accent-color); color: black; border-color: var(--accent-color); }
        .rate-btn.active-bad { background-color: #e22134; border-color: #e22134; }
        
        textarea { width: 100%; height: 140px; background-color: rgba(0,0,0,0.3); color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 18px; font-size: 15px; line-height: 1.6; margin-bottom: 25px; box-sizing: border-box; outline: none; transition: border-color 0.2s; font-family: inherit; }
        textarea:focus { border-color: rgba(255,255,255,0.5); }
        
        #search-view { display: none; padding: 30px 20px; }
        .search-bar { display: flex; gap: 10px; margin: 0 auto 30px auto; max-width: 700px; flex-direction: column; }
        .search-input-wrapper { display: flex; width: 100%; gap: 15px; }
        .search-input { flex: 1; padding: 16px 24px; border-radius: 30px; border: none; background-color: rgba(255,255,255,0.1); color: white; font-size: 16px; font-weight: 500; outline: none; transition: 0.2s; }
        .search-input:focus { background-color: rgba(255,255,255,0.15); box-shadow: 0 0 0 2px rgba(255,255,255,0.1); }
        .search-btn { background-color: var(--text-main); color: var(--bg-color); border: none; border-radius: 30px; padding: 0 30px; font-size: 16px; font-weight: 800; cursor: pointer; transition: transform 0.2s; }
        .search-btn:hover { transform: scale(1.04); }
        
        .do-add-btn { background-color: rgba(255,255,255,0.15); color: white; border: none; border-radius: 20px; padding: 8px 12px; font-size: 12px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: 0.2s; backdrop-filter: blur(5px); }
        .do-add-btn:hover { background-color: var(--text-main); color: var(--bg-color); }
        .load-more-btn { background-color: transparent; color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 30px; padding: 12px 35px; font-weight: 700; cursor: pointer; margin: 30px auto; transition: 0.2s; display: none; }
        .load-more-btn:hover { background-color: rgba(255,255,255,0.1); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background-color: #1a1a1a; padding: 30px; border-radius: 16px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .modal-close { position: absolute; top: 15px; right: 20px; font-size: 28px; color: var(--text-sub); cursor: pointer; background: none; border: none; transition: 0.2s; }
        .modal-close:hover { color: white; }
        .poster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px; margin-top: 20px; }
        .poster-grid img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .poster-grid img:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(29,185,84,0.4); }
    </style>
</head>
<body>
    <header>
        <div class="logo-nav">
            <h1 onclick="switchTab('library')">Movie Library</h1>
            <button id="tab-lib" class="nav-btn active" onclick="switchTab('library')">ライブラリ</button>
            <button id="tab-pl" class="nav-btn" onclick="switchTab('playlists')">プレイリスト</button>
        </div>
        <div class="header-controls">
            <label class="toggle-switch">
                <input type="checkbox" id="lang-toggle" onchange="renderCurrentView()"> 原題表示
            </label>
            <select id="column-select" class="header-select" onchange="handleColumnChange()">
                <option value="auto">表示: 自動</option><option value="3">3列</option><option value="4">4列</option><option value="5">5列</option>
            </select>
            <button class="add-btn" onclick="showSearch()">＋ 探す</button>
        </div>
    </header>

    <div id="library-controls" class="controls-bar">
        <input type="text" id="library-search" placeholder="🔍 ライブラリ内検索..." oninput="renderLibrary()" style="flex:1; max-width:250px;">
        <select id="type-filter" onchange="renderLibrary()">
            <option value="all">すべての映画</option>
            <option value="japanese">🇯🇵 邦画のみ</option>
            <option value="masterpiece">🏆 名作 (高評価)</option>
        </select>
        <select id="sort-select" onchange="renderLibrary()">
            <option value="added_desc">🕒 最近追加した順</option>
            <option value="release_desc">📅 公開年（新しい順）</option>
            <option value="release_asc">📅 公開年（古い順）</option>
            <option value="director_asc">🎬 監督順</option>
        </select>
    </div>

    <!-- ライブラリ画面 -->
    <main id="library-view" class="grid-view"></main>

    <!-- プレイリスト一覧画面 -->
    <main id="playlists-view" class="grid-view" style="display: none;"></main>

    <!-- 検索画面 -->
    <main id="search-view">
        <div class="search-bar">
            <div class="search-input-wrapper">
                <input type="text" id="search-input" class="search-input" placeholder="映画タイトル、人物名、または「1999」などの西暦..." onkeypress="handleKeyPress(event)">
                <button class="search-btn" onclick="searchMovies()">検索</button>
            </div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center;">
            <div id="search-results" class="grid-view" style="padding:0; width:100%;"></div>
            <button id="load-more-btn" class="load-more-btn" onclick="loadMoreMovies()">もっと見る ▼</button>
        </div>
    </main>

    <!-- 💎 リッチ詳細画面 -->
    <main id="detail-view">
        <!-- 豪華な背景グラデーション -->
        <div class="backdrop-container">
            <div id="detail-backdrop" class="backdrop-img"></div>
            <div class="backdrop-gradient"></div>
        </div>

        <div class="detail-inner">
            <button class="nav-btn" onclick="switchTab(currentTab)" style="margin-bottom: 20px;">← 戻る</button>
            
            <div id="detail-tagline" class="tagline"></div>

            <div class="detail-header">
                <div class="detail-poster-container">
                    <div class="poster-wrapper" style="margin-bottom:0;">
                        <img id="detail-img" class="movie-poster" src="" alt="Poster">
                    </div>
                    <button class="poster-change-btn" onclick="openPosterModal()">🖼️ ポスター画像を変更</button>
                </div>
                
                <div class="detail-info">
                    <div class="detail-type">Movie</div>
                    <h2 id="detail-title" class="detail-title">映画タイトル</h2>
                    <div id="detail-meta" class="detail-meta"></div>
                    
                    <!-- ★ あらすじ表示 -->
                    <div id="detail-overview" class="overview-text"></div>
                    
                    <div class="action-bar">
                        <a id="spotify-link" href="#" target="_blank" class="spotify-btn">🎵 サントラを探す</a>
                        <button class="pl-add-btn" onclick="openPlaylistModal()">＋ プレイリストに追加</button>
                    </div>
                </div>
            </div>

            <!-- 編集エリア -->
            <div class="editor-section">
                <div class="rating-buttons">
                    <button id="btn-good" class="rate-btn" onclick="setRating('good')">👍 いいね！</button>
                    <button id="btn-bad" class="rate-btn" onclick="setRating('bad')">👎 いまいち</button>
                </div>
                <textarea id="review-text" placeholder="あなただけの感想やメモを残す..."></textarea>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <button class="add-btn" onclick="saveReview()">保存する</button>
                    <button class="nav-btn" onclick="deleteMovie()" style="text-decoration:underline;">ライブラリから削除</button>
                </div>
            </div>

            <h3 class="section-title">Fans also like</h3>
            <div id="recommendations-view" class="horizontal-scroll"></div>
        </div>
    </main>

    <!-- ポスター変更モーダル -->
    <div id="poster-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('poster-modal')">×</button>
            <h3 style="margin-top:0;">ポスターを選択</h3>
            <div id="poster-grid" class="poster-grid"></div>
        </div>
    </div>

    <!-- プレイリスト追加・作成モーダル -->
    <div id="playlist-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('playlist-modal')">×</button>
            <h3 style="margin-top:0;">プレイリストに追加</h3>
            <div style="margin-bottom:20px; display:flex; gap:10px;">
                <input type="text" id="new-pl-name" placeholder="新しいプレイリスト名" style="flex:1; padding:10px 15px; border-radius:30px; border:none; background:rgba(255,255,255,0.1); color:white; outline:none;">
                <button class="add-btn" onclick="createNewPlaylist()">作成</button>
            </div>
            <div id="pl-list" style="display:flex; flex-direction:column; gap:12px;"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, updateDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // === Firebase設定 (入力済み) ===
        const firebaseConfig = {
            apiKey: "AIzaSyDJiwYPBnlz8pRBLzcKaP6ehVxK8njQB-w",
            authDomain: "movieee-ad303.firebaseapp.com",
            projectId: "movieee-ad303",
            storageBucket: "movieee-ad303.firebasestorage.app",
            messagingSenderId: "222014089327",
            appId: "1:222014089327:web:e2be3953a306fd56d2059a" 
        };
        const TMDB_API_KEY = '13ced17918669e7e20cfdbcc172ad520'; 

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let myMovies = [];
        let myPlaylists = [];
        let currentMovieId = null;
        let currentSearchQuery = '';
        let currentPage = 1;
        let totalPages = 1;
        
        window.currentTab = 'library'; 

        // データ同期
        onSnapshot(collection(db, "movies"), (snapshot) => {
            myMovies = [];
            snapshot.forEach(doc => myMovies.push(doc.data()));
            renderCurrentView();
            if (currentMovieId && myMovies.find(m => m.id === currentMovieId)) showDetail(currentMovieId);
        });

        onSnapshot(collection(db, "playlists"), (snapshot) => {
            myPlaylists = [];
            snapshot.forEach(doc => myPlaylists.push(doc.data()));
            renderCurrentView();
        });

        window.switchTab = (tab) => {
            currentTab = tab;
            document.getElementById('tab-lib').classList.remove('active');
            document.getElementById('tab-pl').classList.remove('active');
            
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('search-view').style.display = 'none';
            document.getElementById('library-view').style.display = 'none';
            document.getElementById('playlists-view').style.display = 'none';
            document.getElementById('library-controls').style.display = 'none';
            
            if (tab === 'library') {
                document.getElementById('tab-lib').classList.add('active');
                document.getElementById('library-controls').style.display = 'flex';
                document.getElementById('library-view').style.display = 'grid';
                renderLibrary();
            } else if (tab === 'playlists') {
                document.getElementById('tab-pl').classList.add('active');
                document.getElementById('playlists-view').style.display = 'grid';
                renderPlaylists();
            }
        };

        window.renderCurrentView = () => { if (currentTab === 'library') renderLibrary(); else if (currentTab === 'playlists') renderPlaylists(); };

        window.handleColumnChange = () => {
            const cols = document.getElementById('column-select').value;
            document.documentElement.style.setProperty('--grid-columns', cols === 'auto' ? 'repeat(auto-fill, minmax(160px, 1fr))' : `repeat(${cols}, 1fr)`);
        };

        window.renderLibrary = (filterPlaylistId = null) => {
            const libraryView = document.getElementById('library-view');
            libraryView.innerHTML = ''; 
            
            let displayMovies = myMovies;
            const useOriginalTitle = document.getElementById('lang-toggle').checked;
            
            if (filterPlaylistId) {
                displayMovies = displayMovies.filter(m => m.playlistIds && m.playlistIds.includes(filterPlaylistId));
                document.getElementById('library-controls').style.display = 'none';
            } else {
                const q = document.getElementById('library-search').value.toLowerCase();
                const type = document.getElementById('type-filter').value;
                const sort = document.getElementById('sort-select').value;
                
                if (q) displayMovies = displayMovies.filter(m => (m.title||'').toLowerCase().includes(q) || (m.originalTitle||'').toLowerCase().includes(q) || (m.director||'').toLowerCase().includes(q));
                
                if (type === 'japanese') displayMovies = displayMovies.filter(m => m.isJapanese);
                if (type === 'masterpiece') displayMovies = displayMovies.filter(m => m.voteAverage >= 7.5);

                displayMovies.sort((a, b) => {
                    if (sort === 'added_desc') return (b.addedAt || 0) - (a.addedAt || 0);
                    if (sort === 'release_desc') return (b.releaseDate || '0000').localeCompare(a.releaseDate || '0000');
                    if (sort === 'release_asc') return (a.releaseDate || '9999').localeCompare(b.releaseDate || '9999');
                    if (sort === 'director_asc') return (a.director || '').localeCompare(b.director || '', 'ja');
                    return 0;
                });
            }

            if (displayMovies.length === 0) {
                libraryView.innerHTML = '<p style="color: var(--text-sub);">映画がありません。</p>';
                return;
            }
            
            displayMovies.forEach(movie => {
                const titleToUse = useOriginalTitle && movie.originalTitle ? movie.originalTitle : movie.title;
                const year = movie.releaseDate ? movie.releaseDate.substring(0, 4) : '';
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => showDetail(movie.id);
                card.innerHTML = `
                    <div class="poster-wrapper"><img class="movie-poster" src="${movie.posterUrl}" loading="lazy"></div>
                    <p class="movie-title">${titleToUse}</p>
                    <p class="movie-subtitle">${year} ${movie.director && movie.director !== '不明' ? `• ${movie.director}` : ''}</p>
                `;
                libraryView.appendChild(card);
            });
        };

        window.renderPlaylists = () => {
            const plView = document.getElementById('playlists-view');
            plView.innerHTML = '';
            
            myPlaylists.sort((a,b) => b.createdAt - a.createdAt).forEach(pl => {
                const moviesInPl = myMovies.filter(m => m.playlistIds && m.playlistIds.includes(pl.id));
                const posters = moviesInPl.slice(0, 4).map(m => m.posterUrl);
                while(posters.length < 4) posters.push('data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'); 
                
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => {
                    document.getElementById('playlists-view').style.display = 'none';
                    document.getElementById('library-view').style.display = 'grid';
                    renderLibrary(pl.id); 
                };
                card.innerHTML = `
                    <div class="playlist-cover">
                        <img src="${posters[0]}"><img src="${posters[1]}"><img src="${posters[2]}"><img src="${posters[3]}">
                    </div>
                    <p class="movie-title">${pl.name}</p>
                    <p class="movie-subtitle">${moviesInPl.length} 本の映画</p>
                `;
                plView.appendChild(card);
            });
        };

        window.showSearch = () => {
            document.getElementById('library-view').style.display = 'none';
            document.getElementById('playlists-view').style.display = 'none';
            document.getElementById('library-controls').style.display = 'none';
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('search-view').style.display = 'block';
            document.getElementById('search-input').focus();
        };

        window.handleKeyPress = (e) => { if (e.key === 'Enter') searchMovies(); };
        
        window.searchMovies = async () => {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;
            currentSearchQuery = query;
            currentPage = 1;
            document.getElementById('search-results').innerHTML = '<p style="color:var(--text-sub);">検索中...</p>'; 
            document.getElementById('load-more-btn').style.display = 'none';

            try {
                let combinedResults = [];
                if (/^\d{4}$/.test(query)) {
                    const res = await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_API_KEY}&language=ja-JP&primary_release_year=${query}&sort_by=popularity.desc&page=1`);
                    const data = await res.json();
                    totalPages = data.total_pages;
                    combinedResults = data.results;
                } else {
                    const movieRes = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&language=ja-JP&query=${encodeURIComponent(query)}&page=1`);
                    const movieData = await movieRes.json();
                    totalPages = movieData.total_pages;

                    const personRes = await fetch(`https://api.themoviedb.org/3/search/person?api_key=${TMDB_API_KEY}&language=ja-JP&query=${encodeURIComponent(query)}`);
                    const personData = await personRes.json();
                    let personMovies = [];
                    if (personData.results.length > 0) {
                        const personId = personData.results[0].id; 
                        const creditsRes = await fetch(`https://api.themoviedb.org/3/person/${personId}/movie_credits?api_key=${TMDB_API_KEY}&language=ja-JP`);
                        const creditsData = await creditsRes.json();
                        if(creditsData.crew) personMovies = personMovies.concat(creditsData.crew.filter(m => m.job === 'Director'));
                        if(creditsData.cast) personMovies = personMovies.concat(creditsData.cast);
                    }
                    const map = new Map();
                    personMovies.sort((a,b) => (b.release_date||"").localeCompare(a.release_date||"")).forEach(m => { if(!map.has(m.id)) map.set(m.id, m); });
                    movieData.results.forEach(m => { if(!map.has(m.id)) map.set(m.id, m); });
                    combinedResults = Array.from(map.values());
                }
                
                document.getElementById('search-results').innerHTML = ''; 
                renderSearchResults(combinedResults, false);
            } catch (error) { alert('検索に失敗しました。'); }
        };

        window.loadMoreMovies = async () => {
            if (currentPage >= totalPages) return;
            currentPage++; 
            try {
                let res;
                if (/^\d{4}$/.test(currentSearchQuery)) {
                    res = await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_API_KEY}&language=ja-JP&primary_release_year=${currentSearchQuery}&sort_by=popularity.desc&page=${currentPage}`);
                } else {
                    res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&language=ja-JP&query=${encodeURIComponent(currentSearchQuery)}&page=${currentPage}`);
                }
                const data = await res.json();
                renderSearchResults(data.results, true);
            } catch (error) { alert('追加読み込みに失敗しました。'); }
        };

        function renderSearchResults(results, append = false) {
            const container = document.getElementById('search-results');
            const btn = document.getElementById('load-more-btn');
            if (results.length === 0 && !append) { container.innerHTML = '<p style="color:var(--text-sub);">見つかりませんでした。</p>'; btn.style.display = 'none'; return; }
            
            results.forEach(movie => {
                const posterUrl = movie.poster_path ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Image';
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="poster-wrapper" style="margin-bottom:8px;"><img class="movie-poster" src="${posterUrl}" loading="lazy"></div>
                    <p class="movie-title">${movie.title}</p>
                    <p class="movie-subtitle">${movie.release_date ? movie.release_date.substring(0,4) : ''}</p>
                `;
                const addBtn = document.createElement('button');
                addBtn.className = 'do-add-btn'; addBtn.textContent = '＋ 追加';
                addBtn.onclick = () => addMovieToLibrary(movie.id);
                card.appendChild(addBtn); container.appendChild(card);
            });
            btn.style.display = currentPage < totalPages ? 'block' : 'none';
        }

        window.addMovieToLibrary = async (id) => {
            if (myMovies.find(m => m.id === id)) { alert('登録済みです！'); return; }
            try {
                const res = await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${TMDB_API_KEY}&language=ja-JP&append_to_response=credits`);
                const data = await res.json();
                
                const posterUrl = data.poster_path ? `https://image.tmdb.org/t/p/w500${data.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Image';
                const backdropUrl = data.backdrop_path ? `https://image.tmdb.org/t/p/w1280${data.backdrop_path}` : '';
                const dir = data.credits?.crew?.find(c => c.job === 'Director');
                const castList = data.credits?.cast ? data.credits.cast.slice(0, 5).map(c => c.name) : [];
                const isJp = data.original_language === 'ja' || (data.production_countries && data.production_countries.some(c => c.iso_3166_1 === 'JP'));

                await setDoc(doc(db, "movies", String(id)), {
                    id: id, title: data.title, originalTitle: data.original_title || data.title,
                    posterUrl: posterUrl, backdropUrl: backdropUrl, tagline: data.tagline || '',
                    overview: data.overview || '',
                    review: "", rating: null, addedAt: Date.now(), releaseDate: data.release_date || "9999-99-99",
                    director: dir ? dir.name : '不明', cast: castList, isJapanese: isJp, voteAverage: data.vote_average || 0,
                    playlistIds: []
                });
                alert(`「${data.title}」を追加しました！`);
            } catch (error) { alert('失敗しました。'); }
        };

        window.showDetail = async (id) => {
            const movie = myMovies.find(m => m.id === id);
            if (!movie) return;
            currentMovieId = id;
            const useOrig = document.getElementById('lang-toggle').checked;
            const titleToUse = useOrig && movie.originalTitle ? movie.originalTitle : movie.title;

            document.getElementById('detail-backdrop').style.backgroundImage = movie.backdropUrl ? `url('${movie.backdropUrl}')` : '';
            document.getElementById('detail-tagline').textContent = movie.tagline ? `"${movie.tagline}"` : '';

            document.getElementById('detail-img').src = movie.posterUrl;
            document.getElementById('detail-title').textContent = titleToUse;
            
            document.getElementById('detail-overview').textContent = movie.overview || 'あらすじ情報がありません。';

            document.getElementById('review-text').value = movie.review || "";
            
            const year = movie.releaseDate ? movie.releaseDate.substring(0, 4) : '';
            let metaHtml = `<span>${year}</span>`;
            if (movie.director && movie.director !== '不明') metaHtml += `<span class="meta-dot"></span>監督: <span class="person-link" onclick="searchFromLink('${movie.director}')">${movie.director}</span>`;
            if (movie.cast && movie.cast.length > 0) metaHtml += `<br><span style="margin-top:10px; display:inline-block;">出演: ${movie.cast.map(c => `<span class="person-link" onclick="searchFromLink('${c}')">${c}</span>`).join(', ')}</span>`;
            document.getElementById('detail-meta').innerHTML = metaHtml;

            document.getElementById('spotify-link').href = `https://open.spotify.com/search/${encodeURIComponent(movie.originalTitle + ' soundtrack')}`;

            document.getElementById('btn-good').className = `rate-btn ${movie.rating === 'good' ? 'active-good' : ''}`;
            document.getElementById('btn-bad').className = `rate-btn ${movie.rating === 'bad' ? 'active-bad' : ''}`;
            
            document.getElementById('library-view').style.display = 'none';
            document.getElementById('playlists-view').style.display = 'none';
            document.getElementById('library-controls').style.display = 'none';
            document.getElementById('search-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';
            window.scrollTo(0, 0);

            const recView = document.getElementById('recommendations-view');
            recView.innerHTML = '<p style="color:var(--text-sub);">読み込み中...</p>';
            try {
                const recRes = await fetch(`https://api.themoviedb.org/3/movie/${id}/recommendations?api_key=${TMDB_API_KEY}&language=ja-JP&page=1`);
                const recData = await recRes.json();
                recView.innerHTML = '';
                if(recData.results.length === 0) { recView.innerHTML = '<p style="color:var(--text-sub);">データがありません。</p>'; }
                else {
                    recData.results.forEach(rm => {
                        const rPost = rm.poster_path ? `https://image.tmdb.org/t/p/w200${rm.poster_path}` : 'https://via.placeholder.com/200x300?text=No+Image';
                        const rc = document.createElement('div');
                        rc.className = 'movie-card';
                        rc.innerHTML = `<div class="poster-wrapper" style="margin-bottom:8px;"><img class="movie-poster" src="${rPost}"></div><p class="movie-title" style="font-size:13px;">${rm.title}</p>`;
                        rc.onclick = () => { if(confirm(`「${rm.title}」を検索しますか？`)){ showSearch(); document.getElementById('search-input').value = rm.title; searchMovies(); } };
                        recView.appendChild(rc);
                    });
                }
            } catch(e) { recView.innerHTML = ''; }
        };

        window.searchFromLink = (personName) => { showSearch(); document.getElementById('search-input').value = personName; searchMovies(); };

        window.openPosterModal = async () => {
            document.getElementById('poster-modal').style.display = 'flex';
            const grid = document.getElementById('poster-grid');
            grid.innerHTML = '読み込み中...';
            try {
                const res = await fetch(`https://api.themoviedb.org/3/movie/${currentMovieId}/images?api_key=${TMDB_API_KEY}`);
                const data = await res.json();
                grid.innerHTML = '';
                if(!data.posters || data.posters.length === 0) { grid.innerHTML = '変更できる画像がありません。'; return; }
                
                data.posters.sort((a,b) => b.vote_average - a.vote_average).slice(0, 20).forEach(p => {
                    const imgUrl = `https://image.tmdb.org/t/p/w500${p.file_path}`;
                    const img = document.createElement('img');
                    img.src = imgUrl; img.loading = "lazy";
                    img.onclick = async () => {
                        await updateDoc(doc(db, "movies", String(currentMovieId)), { posterUrl: imgUrl });
                        closeModal('poster-modal');
                    };
                    grid.appendChild(img);
                });
            } catch(e) { grid.innerHTML = 'エラーが発生しました。'; }
        };

        window.openPlaylistModal = () => {
            document.getElementById('playlist-modal').style.display = 'flex';
            renderPlaylistModalList();
        };
        
        window.createNewPlaylist = async () => {
            const name = document.getElementById('new-pl-name').value.trim();
            if(!name) return;
            const id = 'pl_' + Date.now();
            await setDoc(doc(db, "playlists", id), { id: id, name: name, createdAt: Date.now() });
            document.getElementById('new-pl-name').value = '';
        };

        function renderPlaylistModalList() {
            const list = document.getElementById('pl-list');
            list.innerHTML = '';
            const movie = myMovies.find(m => m.id === currentMovieId);
            const mPlIds = movie.playlistIds || [];
            
            myPlaylists.sort((a,b)=>b.createdAt - a.createdAt).forEach(pl => {
                const label = document.createElement('label');
                label.style.display = 'flex'; label.style.alignItems = 'center'; label.style.gap = '12px'; label.style.cursor = 'pointer'; label.style.fontSize = '15px';
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = mPlIds.includes(pl.id);
                cb.style.width = '18px'; cb.style.height = '18px'; cb.style.accentColor = 'var(--accent-color)';
                cb.onchange = async () => {
                    let newIds = [...mPlIds];
                    if(cb.checked) newIds.push(pl.id);
                    else newIds = newIds.filter(id => id !== pl.id);
                    await updateDoc(doc(db, "movies", String(currentMovieId)), { playlistIds: newIds });
                };
                label.appendChild(cb);
                label.appendChild(document.createTextNode(pl.name));
                list.appendChild(label);
            });
        }

        window.closeModal = (id) => document.getElementById(id).style.display = 'none';

        window.setRating = async (rating) => {
            const movie = myMovies.find(m => m.id === currentMovieId);
            await updateDoc(doc(db, "movies", String(currentMovieId)), { rating: movie.rating === rating ? null : rating });
        };
        window.saveReview = async () => {
            await updateDoc(doc(db, "movies", String(currentMovieId)), { review: document.getElementById('review-text').value });
            alert('保存しました。');
        };
        window.deleteMovie = async () => {
            if (confirm('本当に削除しますか？')) {
                await deleteDoc(doc(db, "movies", String(currentMovieId)));
                currentMovieId = null; switchTab(currentTab);
            }
        };
    </script>
</body>
</html>
